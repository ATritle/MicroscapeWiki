name: Build and deploy searchable wiki
on:
  push:
    branches: [main]
    paths: ['docs/**', 'api-gateway/**', 'workers/market-history*', 'scripts/build-seo.mjs', 'scripts/social-cards.mjs', 'scripts/check-seo.mjs', 'scripts/check-xp-player.mjs', 'scripts/check-sprite-animations.mjs', 'scripts/check-world-map.mjs', 'scripts/check-loadout-comparison.mjs', 'scripts/check-loadout-effects.mjs', 'scripts/check-market-trends.mjs', 'scripts/check-own-market-history.mjs', 'scripts/check-bazaar.mjs', 'scripts/check-leaderboards.mjs', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/deploy-wiki.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:seo
      - run: node scripts/check-xp-player.mjs
      - run: node scripts/check-sprite-animations.mjs
      - run: node scripts/check-queue-planner.mjs
      - run: node scripts/check-membership-queue.mjs
      - run: node scripts/check-activity-comparison.mjs
      - run: node scripts/check-world-map.mjs
      - run: node scripts/check-loadout-comparison.mjs
      - run: node scripts/check-loadout-effects.mjs
      - run: node scripts/check-bazaar.mjs
      - run: node scripts/check-leaderboards.mjs
      - run: node scripts/check-market-trends.mjs
      - run: node scripts/check-own-market-history.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .seo-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
